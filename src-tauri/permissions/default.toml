"$schema" = "schemas/schema.json"

[default]
description = "Allows MONA Hub commands from bundled application pages."
permissions = [
  "allow-notify-login-page-ready",
  "allow-close-login-window",
  "allow-minimize-login-window",
  "allow-begin-access-login",
  "allow-log-login-viewport",
  "allow-log-login-diagnostic",
  "allow-show-login-window",
  "allow-toggle-profile-popup",
  "allow-hide-profile-popup",
  "allow-confirm-access-logout",
  "allow-begin-access-logout",
]
