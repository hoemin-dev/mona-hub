<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#454a50">
  <title>MONA Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="appbar" aria-label="MONA Hub 로그인 후 앱 바">
    <header class="brand-area"><img class="hub-icon" src="../prelogin/mona-hub.png" alt="MONA Hub"></header>
    <nav id="appList" class="app-list" aria-label="MONA 애플리케이션"></nav>
    <div class="profile-area">
      <button class="profile-avatar" type="button" aria-label="프로필" title="프로필">
        <img class="profile-icon" src="../assets/icons/profile.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <footer class="status-area" aria-label="준비됨"><span class="status-dot" aria-hidden="true"></span></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
