<!doctype html>
<html lang="ko" class="session-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#454a50">
  <title>MONA Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../auth/session-loading.css">
</head>
<body>
  <main class="appbar" aria-label="MONA Hub 로그인 후 앱 바">
    <header class="brand-area"><img class="hub-icon" src="../prelogin/mona-hub.png" alt="MONA Hub"></header>
    <nav id="appList" class="app-list" aria-label="MONA 애플리케이션"></nav>
    <div class="profile-area">
      <button id="profileButton" class="profile-avatar" type="button" aria-label="프로필 메뉴 (로그인됨)" title="프로필 · 로그인됨" aria-haspopup="menu" aria-expanded="false">
        <svg class="profile-frame" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="profileBackground" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" />
              <stop offset="1" />
            </linearGradient>
            <clipPath id="profileClip">
              <circle cx="14" cy="14" r="13.5" />
            </clipPath>
          </defs>
          <circle cx="14" cy="14" r="13.5" fill="url(#profileBackground)" />
          <g clip-path="url(#profileClip)">
            <image href="../assets/icons/profile-logged-in.svg" x="4" y="5" width="20" height="22" />
          </g>
          <circle class="profile-outline" cx="14" cy="14" r="13.5" stroke-width="1" />
        </svg>
      </button>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
