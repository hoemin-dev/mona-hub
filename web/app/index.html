<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a20">
  <title>MONA Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="launcher" aria-label="MONA Hub 앱 런처">
    <header class="launcher-header">
      <div class="brand-mark" aria-hidden="true">M</div>
      <span class="brand-name">MONA</span>
    </header>

    <nav class="app-list" aria-label="MONA 애플리케이션">
      <button
        class="app-button"
        type="button"
        data-app-name="Manual Kit"
        data-app-url="https://manualkit.pages.dev/editor"
        aria-label="Manual Kit 열기"
      >
        <span class="app-icon app-icon--manual" aria-hidden="true">
          <span></span>
        </span>
        <span class="app-label">Manual<br>Kit</span>
      </button>

      <button
        class="app-button app-button--pending"
        type="button"
        data-app-name="PDFY"
        aria-label="PDFY 준비 중"
        aria-describedby="pdfyStatus"
        disabled
      >
        <span class="app-icon app-icon--pdf" aria-hidden="true">PDF</span>
        <span class="app-label">PDFY</span>
        <span id="pdfyStatus" class="app-badge">준비 중</span>
      </button>
    </nav>

    <footer class="launcher-footer" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="launcherStatus" class="status-text">준비됨</span>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
