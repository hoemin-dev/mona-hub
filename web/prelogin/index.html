<!doctype html>
<html lang="ko" class="session-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a20">
  <title>MONA Hub</title>
  <link rel="stylesheet" href="../assets/fonts/pretendard/pretendard.css">
  <link rel="stylesheet" href="prelogin.css">
  <link rel="stylesheet" href="../auth/session-loading.css">
</head>
<body>
  <main class="prelogin-appbar" aria-label="MONA Hub 로그인 전 앱 바">
    <header class="brand-area">
      <img class="hub-icon" src="mona-hub.png" alt="MONA Hub">
    </header>

    <div class="spacer" aria-hidden="true"></div>

    <nav class="utility-list" aria-label="MONA 유틸리티">
      <button class="utility-button" type="button" aria-label="공구박스" title="공구박스">
        <img class="utility-icon" src="../assets/app-icons/toolbox.png" alt="" aria-hidden="true">
        <span class="utility-label">공구박스</span>
      </button>
      <button class="utility-button" type="button" aria-label="도움말" title="도움말">
        <img class="utility-icon" src="../assets/app-icons/help.png" alt="" aria-hidden="true">
        <span class="utility-label">도움말</span>
      </button>
    </nav>

    <div class="profile-area">
      <button class="profile-avatar" id="profileButton" type="button" aria-label="로그인 창 열기" title="로그인">
        <svg class="profile-frame" width="36" height="36" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="profileBackground" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" />
              <stop offset="1" />
            </linearGradient>
            <clipPath id="profileClip">
              <circle cx="14" cy="14" r="13.5" />
            </clipPath>
          </defs>
          <circle cx="14" cy="14" r="13.5" fill="url(#profileBackground)" />
          <g clip-path="url(#profileClip)">
            <image href="../assets/icons/profile-active.svg" x="4" y="5" width="20" height="22" />
          </g>
          <circle class="profile-outline" cx="14" cy="14" r="13.5" stroke-width="1" />
        </svg>      </button>
    </div>

  </main>
  <script type="module" src="prelogin.js"></script>
</body>
</html>
