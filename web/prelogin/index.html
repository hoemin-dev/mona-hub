<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a20">
  <title>MONA Hub</title>
  <link rel="stylesheet" href="prelogin.css">
</head>
<body>
  <main class="prelogin-appbar" aria-label="MONA Hub 로그인 전 앱 바">
    <header class="brand-area">
      <img class="hub-icon" src="mona-hub.png" alt="MONA Hub">
    </header>

    <div class="spacer" aria-hidden="true"></div>

    <div class="profile-area">
      <button class="profile-avatar" id="profileButton" type="button" aria-label="로그인 창 열기" title="로그인">
        <img class="profile-icon" src="../assets/icons/profile.svg" alt="" aria-hidden="true">
      </button>
    </div>

    <footer class="status-area" aria-label="준비됨">
      <span class="status-dot" aria-hidden="true"></span>
    </footer>
  </main>
  <script type="module" src="prelogin.js"></script>
</body>
</html>
