<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1e24">
  <title>MONA HUB Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-window">
    <header class="window-header" data-tauri-drag-region>
      <span class="window-title" data-tauri-drag-region>MONA HUB</span>
      <div class="window-controls">
        <button id="minimizeButton" class="window-control" type="button" aria-label="로그인 창 최소화" title="최소화">
          <span class="minimize-icon" aria-hidden="true"></span>
        </button>
        <button id="closeButton" class="window-control" type="button" aria-label="로그인 창 닫기" title="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="login-content" aria-labelledby="loginTitle">
      <div class="brand">
        <img class="brand-logo" src="../icons/icon-192.png" alt="">
        <h1 id="loginTitle">MONA Hub</h1>
        <p class="login-prompt">회사 계정으로 로그인하세요.</p>
      </div>

      <div class="login-action">
        <button id="loginButton" class="login-button" type="button">로그인</button>
        <p class="auth-note">로그인 인증 기술은 Microsoft Entra ID를 사용합니다.</p>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      </div>

      <footer class="login-footer">MONAS</footer>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
