<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1e24">
  <title>MONA HUB Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-window">
    <header class="window-header" data-tauri-drag-region>
      <span class="window-title" data-tauri-drag-region>MONA HUB</span>
      <button id="closeButton" class="close-button" type="button" aria-label="로그인 창 닫기" title="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 7 10 10M17 7 7 17"></path>
        </svg>
      </button>
    </header>

    <section class="login-content" aria-labelledby="loginTitle">
      <div class="login-avatar" aria-hidden="true">
        <svg class="avatar-icon" viewBox="0 0 24 24">
          <defs>
            <radialGradient id="loginProfileHead" cx="34%" cy="25%" r="78%">
              <stop offset="0" stop-color="#7d8790"></stop>
              <stop offset="0.38" stop-color="#505962"></stop>
              <stop offset="1" stop-color="#252b31"></stop>
            </radialGradient>
            <linearGradient id="loginProfileBody" x1="7" y1="10" x2="17" y2="21" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#69737c"></stop>
              <stop offset="0.34" stop-color="#464f57"></stop>
              <stop offset="1" stop-color="#20262c"></stop>
            </linearGradient>
          </defs>
          <circle class="avatar-head" cx="12" cy="6.3" r="3.15"></circle>
          <path class="avatar-body" d="M9.55 9.2c.55.45 1.4.7 2.45.7s1.9-.25 2.45-.7c.18 1.2.7 2.08 1.6 2.72 1.55 1.1 2.45 2.88 2.72 5.63.1.95-.65 1.78-1.6 1.78H6.83c-.95 0-1.7-.83-1.6-1.78.27-2.75 1.17-4.53 2.72-5.63.9-.64 1.42-1.52 1.6-2.72Z"></path>
          <path class="avatar-highlight" d="M8.1 16.8c.38-2.35 1.25-3.63 2.48-4.22"></path>
        </svg>
      </div>

      <div class="heading">
        <h1 id="loginTitle">Sign in</h1>
        <p>MONA HUB</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <label for="userId">ID</label>
        <input id="userId" name="userId" type="text" autocomplete="username" required autofocus>

        <label for="password">PASSWORD</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="loginButton" class="login-button" type="submit">LOGIN</button>
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      </form>

      <footer class="login-footer">MONAS</footer>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
