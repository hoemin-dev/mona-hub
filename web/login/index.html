<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1e24">
  <title>MONA HUB Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-window">
    <header class="window-header" data-tauri-drag-region>
      <div class ="titleset">
      <img class="window-icon" src="../icons/icon-192.png"  alt="MONA-HUB">
      <span class="window-title" data-tauri-drag-region>MONA-HUB 로그인</span>
      </div>
      <div class="window-controls">
        <button id="minimizeButton" class="window-control-min" type="button" aria-label="로그인 창 최소화" title="최소화">
          <span class="minimize-icon" aria-hidden="true"></span>
        </button>
         <button id="maximizeButton" class="window-control-max" type="button" aria-label="로그인 창 블활성최대화" title="최대화">
          <span class="maximize-icon" aria-hidden="true"></span>
        </button>
        <button id="closeButton" class="window-control-close" type="button" aria-label="로그인 창 닫기" title="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m 5 5 13 13 M 18 5 5 18"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="login-content" aria-labelledby="loginTitle">
      <div class="brand">
        <img class="brand-logo" src="../icons/icon-192.png" alt="">
        <h1 id="loginTitle">MONA-HUB</h1>
        <!-- <p class="login-prompt">사용자아이디 id@monas.co.kr</p> -->
      </div>

      <div class="login-action">
        <button id="loginButton" class="login-button" type="button">로그인</button>
        <p class="auth-note">사용자 아이디 id@monas.co.kr로 로그인하세요. Microsoft 및 Cloudflare 인증으로 보호됩니다.</p>
        <!-- 로그인 인증 기술은 Microsoft Entra ID를 사용합니다. 회사 계정 형식 id@monas.co.kr -->
        <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      </div>

      <footer class="login-footer">© MONAS, All rights reserved.</footer>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
